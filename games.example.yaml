# Game catalog for a multi-game session.
#
# Copy it and set source to the host directory that contains the executable:
#   cp games.example.yaml games.yaml
#
# id:           unique path segment; names the overlay, prefix, Apollo app,
#               and log lines
# name:         label shown in Apollo/Artemis
# runner:       launcher kind, "wine" (default) or "eden"
# source:       absolute host directory mounted read-only at /games-ro/<id>;
#               the overlay presents it at /games/<id>
# exe:          executable path relative to source; wine only
# rom:          game image path relative to source; eden only; quote a name
#               that contains an apostrophe
# reset_paths:  paths relative to source, cleared once per Wine prefix
# wine_source:  optional absolute Wine tree mounted at /wine/<id>; overrides
#               the session SPRITZ_DIR
# uuid:         optional stable app UUID; empty derives one from id
# eden_content: optional session-wide absolute host directory mounted
#               read-only at /eden-content for updates and DLC
eden_content: /srv/eden/content

games:
  - id: demo
    name: Demo Game
    source: /srv/games/demo
    exe: Demo.exe

  - id: other
    name: Other Game
    source: /srv/games/other
    exe: Other.exe
    wine_source: /srv/wine/other
    reset_paths:
      - Data/Login
      - Data/Cache

  - id: native
    name: Native Game
    runner: eden
    source: /srv/games/native
    rom: game.xci
