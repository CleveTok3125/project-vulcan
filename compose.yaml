name: "vulcan-${SESSION_ID}"

services:
  game:
    build:
      context: .
      args:
        BASE_IMAGE: "${BASE_IMAGE:?run make base first}"
        GPU_VENDOR: "${GPU_VENDOR:-nvidia}"
        APOLLO_PKG: "${APOLLO_PKG:-apollo-git}"
        APOLLO_COMMIT: "${APOLLO_COMMIT:-adc5c5a0bd80831ce495434bb16aee2cd4175fb8}"
    image: "vulcan/game-stream:${IMAGE_TAG:-local}"
    # Never pull: the tag is built locally for its build variant.
    pull_policy: never
    container_name: "vulcan-${SESSION_ID}"
    init: true
    network_mode: host
    read_only: true
    # Do not start automatically after a host reboot.
    restart: "no"
    stop_grace_period: 20s

    tmpfs:
      - /tmp:size=2g
      - /run:size=512m
      - /var:size=1g
      # Overlay mount points for each catalog game; the root filesystem is read-only.
      - /games:size=64m

    # Only the selected render node is exposed. Never add /dev/dri/card*.
    devices:
      - "${RENDER_NODE:?set RENDER_NODE in the selected env file}"

    cap_drop:
      - ALL
    cap_add:
      # The entrypoint creates the volume paths as the game user, so the
      # mounts and the privilege drop need capabilities.
      - SYS_ADMIN
      # Overlayfs copy-up runs with the credentials of the process that
      # mounted the overlay. Without CHOWN, writes to paths that exist only
      # in the read-only lower layer fail with EPERM on a fresh volume.
      - CHOWN
      # Root writes configs and logs into the game-owned volume, and the
      # overlay mount needs write access to its upper directory.
      - DAC_OVERRIDE
      - SETUID
      - SETGID

    security_opt:
      - no-new-privileges:true

    # Numeric host GIDs are passed as environment variables and applied to
    # the game process by the entrypoint. They are not added with group_add,
    # because input and uinput often share the same host GID.
    volumes:
      - "${SPRITZ_DIR:?set SPRITZ_DIR in the selected env file}:/data/spritz-wine-tkg:ro"
      - "${DXVK_HOST_DIR:-/usr/share/dxvk}:/data/dxvk:ro"
      - ".generated:/config/games:ro"
      - "game-data:/data"

    environment:
      SESSION_ID: "${SESSION_ID:?set SESSION_ID in the selected env file}"
      GAMES_CATALOG_PATH: "/config/games/games.json"
      GAME_WIDTH: "${GAME_WIDTH:-1920}"
      GAME_HEIGHT: "${GAME_HEIGHT:-1080}"
      GAME_FPS: "${GAME_FPS:-144}"
      GAMESCOPE_ENABLED: "${GAMESCOPE_ENABLED:-1}"
      GAMESCOPE_RT: "${GAMESCOPE_RT:-0}"
      GAMESCOPE_GRAB_CURSOR: "${GAMESCOPE_GRAB_CURSOR:-1}"
      GAMESCOPE_HIDE_CURSOR_DELAY: "${GAMESCOPE_HIDE_CURSOR_DELAY:-86400000}"
      GAMESCOPE_TOUCH_MODE: "${GAMESCOPE_TOUCH_MODE:-4}"
      GAMESCOPE_FORCE_WINDOWS_FULLSCREEN: "${GAMESCOPE_FORCE_WINDOWS_FULLSCREEN:-1}"
      INPUT_TRANSPORT: "${INPUT_TRANSPORT:-socket}"
      INPUT_GAMEPAD: "${INPUT_GAMEPAD:-1}"
      ENABLE_OVERLAY: "${ENABLE_OVERLAY:-1}"

      RENDER_NODE: "${RENDER_NODE:?set RENDER_NODE in the selected env file}"
      APOLLO_OUTPUT: "${APOLLO_OUTPUT:-HEADLESS-1}"
      APOLLO_ENCODER: "${APOLLO_ENCODER:-nvenc}"
      APOLLO_ADAPTER: "${APOLLO_ADAPTER:-}"
      APOLLO_NAME: "${APOLLO_NAME:-}"
      APOLLO_PORT: "${APOLLO_PORT:-47989}"

      WINE_ROOT: "${WINE_ROOT:-/data/spritz-wine-tkg}"
      UMU_USE_STEAM: "${UMU_USE_STEAM:-1}"
      D3D_BACKEND: "${D3D_BACKEND:-dxvk}"
      DXVK_DIR: "/data/dxvk"
      WINEESYNC: "${WINEESYNC:-}"
      WINEFSYNC: "${WINEFSYNC:-}"
      __GL_SHADER_DISK_CACHE_SKIP_CLEANUP: "${__GL_SHADER_DISK_CACHE_SKIP_CLEANUP:-}"
      DXVK_HUD: "${DXVK_HUD:-}"

      # NVIDIA device nodes are supplied by compose.nvidia.yaml.
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-0}"
      NVIDIA_DRIVER_CAPABILITIES: "all"

      GID_RENDER: "${GID_RENDER:?set GID_RENDER in .env}"
      GID_VIDEO: "${GID_VIDEO:?set GID_VIDEO in .env}"
      GID_STORAGE: "${GID_STORAGE:-}"

    shm_size: "2gb"

    ulimits:
      memlock:
        soft: -1
        hard: -1

volumes:
  # Each session keeps its Wine prefixes and overlay writes.
  game-data:
    name: "vulcan_${SESSION_ID:?}-data"
