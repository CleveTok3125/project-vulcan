services:
  game:
    # The image ships NVIDIA userland libraries, so passing the host device
    # nodes is enough. Keep this list in sync with the host driver version;
    # rebuild the image after a major driver update.
    devices:
      - /dev/nvidiactl
      - /dev/nvidia0
      - /dev/nvidia-modeset
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
      - /dev/nvidia-caps
